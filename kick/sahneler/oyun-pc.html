<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Sade PC Oyun İçi Canlı Yayın (Kick In-Game Overlay)</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    /* PC Oyunları için Tam Şeffaf Tuval */
    body, html {
      background-color: transparent !important;
      overflow: hidden;
    }
    .overlay-canvas {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div class="overlay-canvas">
    
    <!-- 1. ÜST ESPOR HUD KÖPRÜSÜ (SON OLAYLAR & CANLI HEDEF ÇUBUĞU) -->
    <div class="top-deluxe-bar">
      
      <div class="top-left-cluster">
        <div class="brand-pill">
          <div class="brand-dot"></div>
          <span class="brand-text">KICK LIVE</span>
        </div>

        <div class="event-stat-card">
          <div class="event-stat-icon">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="#ff69b4"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="event-stat-info">
            <span class="event-stat-label">SON TAKİP</span>
            <span class="event-stat-val" id="recent-follower">-</span>
          </div>
        </div>

        <div class="event-stat-card sub-card">
          <div class="event-stat-icon">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="#53fc18"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
          </div>
          <div class="event-stat-info">
            <span class="event-stat-label">SON ABONE</span>
            <span class="event-stat-val" id="recent-sub">-</span>
          </div>
        </div>

        <div class="event-stat-card donation-card">
          <div class="event-stat-icon">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="#ffd700"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
          </div>
          <div class="event-stat-info">
            <span class="event-stat-label">SON DESTEK</span>
            <span class="event-stat-val" id="recent-donation">-</span>
          </div>
        </div>
      </div>

      <div class="goal-deluxe-container">
        <div class="goal-meta-row">
          <span class="goal-title-badge" id="goal-title">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10 10-4.49 10-10S17.51 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3-8c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"/></svg>
            TAKİPÇİ HEDEFİ
          </span>
          <span class="goal-numbers" id="goal-counter">0 / 200</span>
        </div>
        <div class="goal-track">
          <div class="goal-fill-laser" id="goal-fill"></div>
        </div>
      </div>

    </div>

    <!-- 2. SOL ALT KULAKLI WEBCAM ÇERÇEVESİ (320 × 180 px - 16:9) -->
    <div class="webcam-container">
      <div class="webcam-deluxe-box">
        <!-- Minik Şık Kulaklar -->
        <div class="cam-ear-left"></div>
        <div class="cam-ear-right"></div>

        <div class="cam-header-strip">
          <div class="cam-live-indicator"></div>
          <span class="cam-live-title">LIVE CAM</span>
        </div>

        <div class="cam-bottom-badge">
          <span class="cam-username bind-username">MİRA</span>
          <span class="cam-rank-tag bind-rank">KICK LIVE</span>
        </div>
      </div>
    </div>

    <!-- 3. SAĞ TARAF: DELUXE KICK CANLI CHAT KUTUSU -->
    <div class="chat-deluxe-panel" id="chat-container">
      <div class="chat-deluxe-header">
        <div class="chat-header-left">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#53fc18"><path d="M4 3h5v6h2V5h5v5h-3v4h3v5h-5v-4h-2v6H4V3z"/></svg>
          <span>KICK CANLI SOHBET</span>
        </div>
        <span class="chat-live-tag">CANLI</span>
      </div>
      <div class="chat-stream-feed" id="chat-messages">
        <!-- Canlı Kick Chat Akışı -->
      </div>
    </div>

    <!-- 4. ALT DELUXE 3'LÜ SOSYAL MEDYA ŞERİDİ (KICK, TIKTOK, YOUTUBE) -->
    <div class="bottom-deluxe-ribbon">
      <div class="bottom-brand-badge">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="#000"><path d="M4 3h5v6h2V5h5v5h-3v4h3v5h-5v-4h-2v6H4V3z"/></svg>
        <span>KICK</span>
      </div>

      <div class="bottom-social-rotator" id="social-display">
        <!-- config.js'teki 3'lü sosyal medya dönecek -->
      </div>

      <div class="bottom-live-clock" id="live-clock">--:--:--</div>
    </div>

  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/state-manager.js"></script>
  <script src="../../assets/js/audio-alerts.js"></script>
  <script src="../../assets/js/kick-client.js"></script>
  <script src="../../assets/js/overlay.js"></script>
</body>
</html>
