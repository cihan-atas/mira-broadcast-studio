<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Sahne 4: Mola (Be Right Back with Live Chat)</title>
  <link rel="stylesheet" href="../../assets/css/scenes.css">
</head>
<body data-scene-type="brb">
  <div class="scene-wrapper">
    
    <div class="scene-layout-with-chat">
      
      <!-- Sol Kolon: Ana Mola Kartı -->
      <div class="scene-main-col">
        <div class="scene-card">
          <div class="brand-row">
            <div class="tiktok-pill">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M4 3h5v6h2V5h5v5h-3v4h3v5h-5v-4h-2v6H4V3z"/></svg>
              <span>TIKTOK LIVE</span>
            </div>
            <div class="mlbb-tag">KISA BİR MOLA</div>
          </div>

          <h1 class="scene-title">HEMEN DÖNECEĞİM</h1>
          <p class="scene-subtitle">ENERJİ DEPOLAYIP LORD MÜCADELESİNE DEVAM EDECEĞİZ...</p>

          <div class="scene-status-badge">
            <span style="font-size: 20px;">☕</span>
            <span>Kahve & Atıştırmalık Molası (Birkaç Dakikaya Buradayız)</span>
          </div>

          <div class="scene-music-ticker" style="margin-top: 25px;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="#ff69b4"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Şu An Çalan: <strong>Chill Lofi • Şafak Vadisi Dinlenme Müziği</strong></span>
          </div>

          <div class="scene-socials" style="position: static; margin-top: 30px; box-shadow: none;">
            <div class="scene-social-item">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="#ff69b4"><path d="M4 3h5v6h2V5h5v5h-3v4h3v5h-5v-4h-2v6H4V3z"/></svg>
              <span class="bind-kick-channel">kick.com/mira</span>
            </div>
            <div class="scene-social-item">
              <span>📱 @mira_mlbb</span>
            </div>
            <div class="scene-social-item">
              <span>▶ @mira.gaming (YouTube)</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Sağ Kolon: Canlı Kick Chat Paneli -->
      <div class="scene-chat-col">
        <div class="large-chat-panel">
          <div class="large-chat-header">
            <div class="large-chat-title">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="#ff69b4"><path d="M4 3h5v6h2V5h5v5h-3v4h3v5h-5v-4h-2v6H4V3z"/></svg>
              <span>TIKTOK CANLI SOHBET</span>
            </div>
            <span class="chat-live-tag">● MOLA SOHBETİ</span>
          </div>
          <div class="large-chat-feed" id="chat-messages">
            <!-- Otomatik ve canlı mesajlar akacak -->
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/scene-chat.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const config = window.OVERLAY_CONFIG || {};
      const channelEl = document.querySelector('.bind-kick-channel');
      if (channelEl && config.kickChannel) {
        channelEl.textContent = `kick.com/${config.kickChannel}`;
      }
    });
  </script>
</body>
</html>
