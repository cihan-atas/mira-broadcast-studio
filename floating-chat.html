<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MİRA STUDIO — Canlı Sohbet Konsolu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --chat-opacity: 0.95;
      --chat-font-size: 13.5px;
      --accent-kick: #00f5a0;
      --accent-mira: #a855f7;
      --accent-tiktok: #fe2c55;
      --accent-gold: #f59e0b;
      --bg-dark: #07090e;
      --bg-card: rgba(18, 22, 38, var(--chat-opacity));
      --border-color: rgba(168, 85, 247, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: #f1f5f9;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Ana Kapsayıcı Kabuk */
    .chat-window-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: rgba(9, 11, 20, var(--chat-opacity));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 12px;
      overflow: hidden;
      transition: background 0.15s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.75);
    }

    /* Overlay (OBS) Modu */
    body.mode-overlay .chat-window-shell {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
    }
    body.mode-overlay .chat-header-bar,
    body.mode-overlay .streamer-reply-console {
      display: none !important;
    }

    /* 1. ÜST KONTROL ÇUBUĞU */
    .chat-header-bar {
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(20, 24, 40, 0.98), rgba(12, 15, 26, 0.96));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      gap: 8px;
      flex-shrink: 0;
      -webkit-app-region: drag; /* Electron pencere sürükleme */
    }

    .chat-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-title-tag {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #c084fc;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f5a0;
      box-shadow: 0 0 10px #00f5a0;
      animation: pulseLive 1.5s infinite;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .chat-header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .control-btn:hover {
      background: rgba(168, 85, 247, 0.2);
      border-color: #a855f7;
      color: #fff;
    }
    .control-btn.active {
      background: rgba(0, 245, 160, 0.2);
      border-color: #00f5a0;
      color: #00f5a0;
    }

    /* Opaklık Ayar Satırı */
    .chat-opacity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      -webkit-app-region: no-drag;
    }

    .opacity-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .opacity-slider-wrap input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: #a855f7;
      cursor: pointer;
    }

    .filter-pills {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .filter-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      cursor: pointer;
    }
    .filter-pill.active {
      background: #7c3aed;
      border-color: #a855f7;
      color: #fff;
    }

    /* 2. CHAT AKIŞ ALANI */
    .chat-feed-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      scroll-behavior: smooth;
      position: relative;
    }

    .chat-feed-container::-webkit-scrollbar {
      width: 5px;
    }
    .chat-feed-container::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 4px;
    }

    /* Mesaj Kartları */
    .chat-msg-card {
      background: rgba(16, 20, 36, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-left: 3px solid rgba(168, 85, 247, 0.6);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: var(--chat-font-size);
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: msgPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.15s ease;
      user-select: text;
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-msg-card:hover {
      background: rgba(25, 32, 56, 0.85);
      border-color: rgba(168, 85, 247, 0.5);
    }

    /* Yayıncı Mesajı Özel Stili */
    .chat-msg-card.is-streamer {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(245, 158, 11, 0.6);
      border-left: 4px solid #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.25);
    }

    /* Mesaj Başlık Satırı */
    .msg-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .msg-meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .msg-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .msg-badge.badge-streamer {
      background: #f59e0b;
      color: #000;
    }
    .msg-badge.badge-mod {
      background: #10b981;
      color: #000;
    }
    .msg-badge.badge-sub {
      background: #06b6d4;
      color: #000;
    }
    .msg-badge.badge-vip {
      background: #ec4899;
      color: #fff;
    }
    .msg-badge.badge-kick {
      background: #00f5a0;
      color: #000;
    }
    .msg-badge.badge-tiktok {
      background: #fe2c55;
      color: #fff;
    }

    .msg-username {
      font-weight: 800;
      font-size: 11.5px;
      color: #e2e8f0;
      cursor: pointer;
    }
    .msg-username:hover {
      text-decoration: underline;
      color: #00f5a0;
    }
    .is-streamer .msg-username {
      color: #fbbf24;
    }

    .msg-time {
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
    }

    .msg-body-text {
      color: #f1f5f9;
      word-break: break-word;
      font-weight: 500;
    }
    .is-streamer .msg-body-text {
      color: #fef3c7;
      font-weight: 600;
    }

    /* Mesaj Hover Aksiyonları */
    .msg-actions {
      display: none;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }
    .chat-msg-card:hover .msg-actions {
      display: flex;
    }
    .msg-action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .msg-action-btn:hover {
      background: #a855f7;
      color: #fff;
    }

    /* Yeni Mesaj Var Bildirimi */
    .new-messages-pill {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #7c3aed;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 99px;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.6);
      cursor: pointer;
      display: none;
      z-index: 10;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translate(-50%, 0); }
      to { transform: translate(-50%, -4px); }
    }

    /* 3. YAYINCI YANIT KONSOLU (ALT PANEL) */
    .streamer-reply-console {
      background: linear-gradient(180deg, rgba(12, 15, 26, 0.98), rgba(8, 10, 18, 0.98));
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 12px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    /* Hızlı Yanıt Çipleri */
    .quick-chips-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .quick-chips-row::-webkit-scrollbar {
      display: none;
    }
    .quick-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .quick-chip:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: #a855f7;
      color: #fff;
    }

    /* Hızlı Emoji Çubuğu */
    .quick-emojis-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .quick-emoji-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: transform 0.1s;
    }
    .quick-emoji-btn:hover {
      transform: scale(1.3);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Giriş ve Gönder Butonu */
    .reply-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .sender-tag {
      font-size: 11px;
      font-weight: 900;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 6px 8px;
      border-radius: 8px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reply-text-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .reply-text-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .btn-send-reply {
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-send-reply:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.5);
    }
  </style>
</head>
<body>

  <div class="chat-window-shell" id="chat-shell">
    
    <!-- 1. ÜST KONTROL ÇUBUĞU -->
    <header class="chat-header-bar" id="chat-header">
      <div class="chat-header-top">
        <div class="chat-title-tag">
          <span class="live-dot"></span>
          <span>MİRA CANLI SOHBET</span>
          <span id="chat-counter-badge" style="font-size:9.5px; color:#94a3b8; font-weight:700;">(0 Mesaj)</span>
        </div>

        <div class="chat-header-controls">
          <button type="button" class="control-btn" id="btn-font-toggle" onclick="toggleFontSize()" title="Yazı Boyutunu Değiştir">
            Aa
          </button>
          <button type="button" class="control-btn" id="btn-sound-toggle" onclick="toggleChatSound()" title="Mesaj Sesini Aç/Kapat">
            🔔 Ses
          </button>
          <button type="button" class="control-btn active" id="btn-pin-toggle" onclick="toggleAlwaysOnTop()" title="Her Zaman En Üstte Tut">
            📌 Üstte Sabit
          </button>
        </div>
      </div>

      <!-- Opaklık Slider'ı & Filtreler -->
      <div class="chat-opacity-row">
        <div class="opacity-slider-wrap">
          <span>🪟 Opaklık:</span>
          <input type="range" id="chat-opacity-slider" min="15" max="100" value="95" oninput="setChatOpacity(this.value)">
          <span id="opacity-val-label" style="font-family:monospace; font-weight:800; color:#c084fc;">%95</span>
        </div>

        <div class="filter-pills">
          <button class="filter-pill active" onclick="setPlatformFilter('all', this)">Tümü</button>
          <button class="filter-pill" onclick="setPlatformFilter('kick', this)">🟢 Kick</button>
          <button class="filter-pill" onclick="setPlatformFilter('tiktok', this)">📱 TikTok</button>
          <button class="filter-pill" onclick="setPlatformFilter('streamer', this)">👑 Yayıncı</button>
        </div>
      </div>
    </header>

    <!-- 2. MESAJ AKIŞ LİSTESİ -->
    <main class="chat-feed-container" id="chat-feed">
      <!-- Hoş geldin mesajı -->
      <div class="chat-msg-card is-streamer">
        <div class="msg-header-row">
          <div class="msg-meta-left">
            <span class="msg-badge badge-streamer">👑 YAYINCI</span>
            <span class="msg-username">MİRA (Yayıncı)</span>
          </div>
          <span class="msg-time" id="init-time">17:00</span>
        </div>
        <div class="msg-body-text">
          🚀 MİRA Canlı Sohbet Konsolu aktif! Kick ve TikTok mesajları buraya akar. Buradan çıkmadan doğrudan cevap verebilirsiniz.
        </div>
      </div>
    </main>

    <!-- Yeni mesaj gelince aşağı kaydır butonu -->
    <div class="new-messages-pill" id="new-messages-pill" onclick="scrollToBottom()">
      ⬇️ Yeni Mesajlar
    </div>

    <!-- 3. YAYINCI YANIT KONSOLU -->
    <footer class="streamer-reply-console" id="streamer-reply-console">
      
      <!-- Hızlı Yanıt Çipleri -->
      <div class="quick-chips-row">
        <button class="quick-chip" onclick="quickReply('👋 Hoş geldin!')">👋 Hoş geldin!</button>
        <button class="quick-chip" onclick="quickReply('🙏 Çok teşekkürler!')">🙏 Teşekkürler!</button>
        <button class="quick-chip" onclick="quickReply('🎮 Birazdan yeni maça geçiyoruz!')">🎮 Yeni Maç!</button>
        <button class="quick-chip" onclick="quickReply('💬 !discord sunucumuza bekleriz: discord.gg/mira')">💬 !discord</button>
        <button class="quick-chip" onclick="quickReply('🔥 !rank Hedefimiz: Mythic Immortal!')">🔥 !rank</button>
        <button class="quick-chip" onclick="quickReply('📱 !tiktok takip etmeyi unutmayın!')">📱 !tiktok</button>
      </div>

      <!-- Hızlı Emoji Çubuğu -->
      <div class="quick-emojis-row">
        <span style="font-size:10px; color:#64748b; font-weight:800;">HIZLI:</span>
        <button class="quick-emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('❤️')">❤️</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('👏')">👏</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('👑')">👑</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('⚡')">⚡</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('🎮')">🎮</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('💀')">💀</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('✨')">✨</button>
        <button class="quick-emoji-btn" onclick="insertEmoji('🚀')">🚀</button>
      </div>

      <!-- Giriş Kutusu -->
      <div class="reply-input-row">
        <span class="sender-tag">👑 MİRA:</span>
        <input type="text" id="streamer-msg-input" class="reply-text-input" placeholder="Sohbete cevap yazın... (Enter ile gönder)" autocomplete="off">
        <button type="button" class="btn-send-reply" id="btn-send-reply" onclick="sendStreamerReply()">
          🚀 GÖNDER
        </button>
      </div>
    </footer>

  </div>

  <script>
    (function () {
      'use strict';

      // 1. Durum Değişkenleri
      let messages = [];
      let totalMessageCount = 0;
      let activeFilter = 'all';
      let soundEnabled = true;
      let fontSizeIdx = 1; // 0: 12px, 1: 13.5px, 2: 15px
      const fontSizes = ['12px', '13.5px', '15.5px'];
      let autoScroll = true;
      let unreadBelow = 0;
      let kickWs = null;
      let lastPollTime = Date.now() - 5000;

      const chatFeed = document.getElementById('chat-feed');
      const inputEl = document.getElementById('streamer-msg-input');
      const counterBadge = document.getElementById('chat-counter-badge');
      const newMsgPill = document.getElementById('new-messages-pill');

      // Saat Formatı
      function getNowTimeStr() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      document.getElementById('init-time').textContent = getNowTimeStr();

      // Query Params Kontrolü (OBS Overlay Modu)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('overlay') === '1') {
        document.body.classList.add('mode-overlay');
      }

      // Kayıtlı Opaklığı Yükle
      const savedOpacity = localStorage.getItem('mira_chat_opacity');
      if (savedOpacity) {
        setChatOpacity(savedOpacity);
        document.getElementById('chat-opacity-slider').value = savedOpacity;
      }

      // 2. Opaklık Ayarlayıcı (Streamer browser'ı görsün diye)
      window.setChatOpacity = function (val) {
        const op = Math.max(0.15, Math.min(1.0, val / 100));
        document.documentElement.style.setProperty('--chat-opacity', op);
        const label = document.getElementById('opacity-val-label');
        if (label) label.textContent = `%${val}`;
        localStorage.setItem('mira_chat_opacity', val);
      };

      // 3. Yazı Boyutu Değiştirici
      window.toggleFontSize = function () {
        fontSizeIdx = (fontSizeIdx + 1) % fontSizes.length;
        document.documentElement.style.setProperty('--chat-font-size', fontSizes[fontSizeIdx]);
      };

      // 4. Ses Efekti Aç/Kapat
      window.toggleChatSound = function () {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('btn-sound-toggle');
        btn.textContent = soundEnabled ? '🔔 Ses' : '🔕 Sessiz';
        btn.classList.toggle('active', soundEnabled);
      };

      function playDingSound() {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } catch (e) {}
      }

      // 5. Her Zaman Üstte Sabitleme (Electron / Document PiP)
      window.toggleAlwaysOnTop = function () {
        const btn = document.getElementById('btn-pin-toggle');
        // Eğer Electron içindeysek veya harici pencere ise
        btn.classList.toggle('active');
      };

      // 6. Platform Filtresi
      window.setPlatformFilter = function (filter, btnEl) {
        activeFilter = filter;
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        if (btnEl) btnEl.classList.add('active');

        document.querySelectorAll('.chat-msg-card').forEach(card => {
          const plat = card.dataset.platform || 'all';
          const isStr = card.dataset.isStreamer === 'true';

          if (filter === 'all') {
            card.style.display = 'flex';
          } else if (filter === 'streamer') {
            card.style.display = isStr ? 'flex' : 'none';
          } else {
            card.style.display = plat === filter ? 'flex' : 'none';
          }
        });
      };

      // 7. Mesaj Ekleme Motoru
      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function appendMessage(item) {
        totalMessageCount++;
        counterBadge.textContent = `(${totalMessageCount} Mesaj)`;

        const isStreamer = !!item.isStreamer || item.username === 'MİRA' || item.username === 'MİRA (Yayıncı)' || item.badge === 'streamer';
        const platform = item.platform || (item.badge === 'tiktok' ? 'tiktok' : (item.badge === 'kick' ? 'kick' : 'kick'));
        const timeStr = item.timeStr || getNowTimeStr();

        let badgeClass = 'badge-sub';
        let badgeLabel = 'İZLEYİCİ';

        if (isStreamer) {
          badgeClass = 'badge-streamer';
          badgeLabel = '👑 YAYINCI';
        } else if (item.badge === 'mod' || item.isMod) {
          badgeClass = 'badge-mod';
          badgeLabel = '⚔️ MOD';
        } else if (item.badge === 'sub' || item.isSub) {
          badgeClass = 'badge-sub';
          badgeLabel = '💎 ABONE';
        } else if (item.badge === 'vip') {
          badgeClass = 'badge-vip';
          badgeLabel = '⭐ VIP';
        } else if (platform === 'tiktok') {
          badgeClass = 'badge-tiktok';
          badgeLabel = 'TIKTOK';
        } else if (platform === 'kick') {
          badgeClass = 'badge-kick';
          badgeLabel = 'KICK';
        }

        const card = document.createElement('div');
        card.className = `chat-msg-card ${isStreamer ? 'is-streamer' : ''}`;
        card.dataset.platform = platform;
        card.dataset.isStreamer = isStreamer ? 'true' : 'false';

        card.innerHTML = `
          <div class="msg-header-row">
            <div class="msg-meta-left">
              <span class="msg-badge ${badgeClass}">${badgeLabel}</span>
              <span class="msg-username" onclick="replyToUser('${escapeHtml(item.username)}')">${escapeHtml(item.username)}</span>
            </div>
            <span class="msg-time">${timeStr}</span>
          </div>
          <div class="msg-body-text">${escapeHtml(item.content)}</div>
          <div class="msg-actions">
            <button type="button" class="msg-action-btn" onclick="replyToUser('${escapeHtml(item.username)}')">↩️ Yanıtla</button>
            <button type="button" class="msg-action-btn" onclick="speakMessage('${escapeHtml(item.username)}: ${escapeHtml(item.content)}')">🔊 Oku</button>
            <button type="button" class="msg-action-btn" onclick="copyMsgText('${escapeHtml(item.content)}')">📋 Kopyala</button>
          </div>
        `;

        // Filtreye göre gizle/göster
        if (activeFilter !== 'all') {
          if (activeFilter === 'streamer' && !isStreamer) card.style.display = 'none';
          if (activeFilter === 'kick' && platform !== 'kick') card.style.display = 'none';
          if (activeFilter === 'tiktok' && platform !== 'tiktok') card.style.display = 'none';
        }

        chatFeed.appendChild(card);

        // Mesaj limiti: En son 120 mesajı tut
        while (chatFeed.children.length > 120) {
          chatFeed.removeChild(chatFeed.firstChild);
        }

        if (autoScroll) {
          chatFeed.scrollTop = chatFeed.scrollHeight;
        } else {
          unreadBelow++;
          newMsgPill.style.display = 'block';
          newMsgPill.textContent = `⬇️ Yeni Mesajlar (${unreadBelow})`;
        }

        if (!isStreamer) {
          playDingSound();
        }
      }

      // Kullanıcıya Yanıtla
      window.replyToUser = function (uname) {
        if (!inputEl) return;
        inputEl.value = `@${uname} ` + inputEl.value;
        inputEl.focus();
      };

      // TTS Oku
      window.speakMessage = function (text) {
        try {
          if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'tr-TR';
            u.rate = 1.05;
            window.speechSynthesis.speak(u);
          }
        } catch (e) {}
      };

      // Kopyala
      window.copyMsgText = function (text) {
        try {
          navigator.clipboard.writeText(text);
        } catch (e) {}
      };

      // 8. Scroll Takibi
      chatFeed.addEventListener('scroll', () => {
        const isNearBottom = chatFeed.scrollHeight - chatFeed.scrollTop - chatFeed.clientHeight < 40;
        autoScroll = isNearBottom;
        if (isNearBottom) {
          unreadBelow = 0;
          newMsgPill.style.display = 'none';
        }
      });

      window.scrollToBottom = function () {
        chatFeed.scrollTop = chatFeed.scrollHeight;
        unreadBelow = 0;
        newMsgPill.style.display = 'none';
        autoScroll = true;
      };

      // 9. YAYINCININ CEVAP GÖNDERMESİ
      window.sendStreamerReply = function () {
        const text = (inputEl.value || '').trim();
        if (!text) return;

        const payload = {
          type: 'TEST_CHAT',
          username: 'MİRA (Yayıncı)',
          content: text,
          badge: 'streamer',
          isStreamer: true,
          platform: 'mira',
          timeStr: getNowTimeStr(),
          time: Date.now()
        };

        // Kendi penceremize ekle
        appendMessage(payload);

        // Diğer pencerelere ve OBS sahnelerine yayınla
        try {
          const bus = new BroadcastChannel('kick_stream_bus');
          bus.postMessage(payload);
        } catch (e) {}
        try {
          const bus2 = new BroadcastChannel('kick_hero_bus');
          bus2.postMessage(payload);
        } catch (e) {}

        // Sunucu eventQueue'ya gönder
        if (window.location.protocol.startsWith('http')) {
          fetch('/api/test-alert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(() => {});
        }

        inputEl.value = '';
        inputEl.focus();
        scrollToBottom();
      };

      // Enter ile gönderme
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendStreamerReply();
        }
      });

      // Hızlı Yanıt Çipi
      window.quickReply = function (text) {
        inputEl.value = text;
        sendStreamerReply();
      };

      // Emoji Ekle
      window.insertEmoji = function (em) {
        inputEl.value += em;
        inputEl.focus();
      };

      // 10. DIŞ OLAYLARI DİNLEME (BroadcastChannel & Server Poll)
      function setupBroadcastListeners() {
        try {
          const bus = new BroadcastChannel('kick_stream_bus');
          bus.onmessage = (e) => {
            if (!e.data) return;
            if (e.data.type === 'TEST_CHAT' || e.data.type === 'CHAT_MESSAGE' || e.data.type === 'chat') {
              appendMessage({
                username: e.data.username || e.data.user || 'İzleyici',
                content: e.data.content || e.data.text || e.data.message || '',
                badge: e.data.badge || 'sub',
                isStreamer: !!e.data.isStreamer,
                platform: e.data.platform || 'kick'
              });
            }
          };
        } catch (e) {}

        try {
          const heroBus = new BroadcastChannel('kick_hero_bus');
          heroBus.onmessage = (e) => {
            if (!e.data) return;
            if (e.data.type === 'TEST_CHAT' || e.data.type === 'CHAT_MESSAGE' || e.data.type === 'chat') {
              appendMessage({
                username: e.data.username || e.data.user || 'İzleyici',
                content: e.data.content || e.data.text || e.data.message || '',
                badge: e.data.badge || 'sub',
                isStreamer: !!e.data.isStreamer,
                platform: e.data.platform || 'kick'
              });
            }
          };
        } catch (e) {}
      }
      setupBroadcastListeners();

      // 11. SUNUCU POLLING (TikTok Yorumları ve Arka Plan Olayları)
      function pollServerEvents() {
        if (!window.location.protocol.startsWith('http')) return;
        fetch(`/api/poll?since=${lastPollTime}`)
          .then(r => r.json())
          .then(d => {
            if (d && Array.isArray(d.events)) {
              d.events.forEach(ev => {
                if (ev.time && ev.time > lastPollTime) {
                  lastPollTime = ev.time;
                }
                if (ev.type === 'TEST_CHAT' || ev.type === 'CHAT_MESSAGE') {
                  appendMessage({
                    username: ev.username || 'İzleyici',
                    content: ev.content || ev.text || '',
                    badge: ev.badge || 'tiktok',
                    isStreamer: !!ev.isStreamer,
                    platform: ev.platform || 'tiktok'
                  });
                }
              });
            }
          })
          .catch(() => {})
          .finally(() => {
            setTimeout(pollServerEvents, 1400);
          });
      }
      pollServerEvents();

      // 12. KICK CANLI PUSHER WEBSOCKET BAĞLANTISI
      async function connectLiveKickChat() {
        const channelSlug = localStorage.getItem('kick_channel_slug') || 'cihanatas';
        try {
          let chanData = null;
          try {
            const r = await fetch(`/api/kick/channel?slug=${encodeURIComponent(channelSlug)}`);
            if (r.ok) chanData = await r.json();
          } catch (e) {}

          if (!chanData || !chanData.chatroom) {
            const r2 = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(channelSlug)}`);
            if (r2.ok) chanData = await r2.json();
          }

          if (!chanData || !chanData.chatroom) return;
          const chatroomId = chanData.chatroom.id;

          const pusherKey = "32cbd69e4b950ba97041";
          const wsUrl = `wss://ws-us2.pusher.com/app/${pusherKey}?protocol=7&client=js&version=8.4.0-rc2&flash=false`;
          kickWs = new WebSocket(wsUrl);

          kickWs.onopen = () => {
            kickWs.send(JSON.stringify({
              event: 'pusher:subscribe',
              data: { channel: `chatrooms.${chatroomId}.v2` }
            }));
          };

          kickWs.onmessage = (msg) => {
            try {
              const packet = JSON.parse(msg.data);
              if (packet.event === 'pusher:ping') {
                kickWs.send(JSON.stringify({ event: 'pusher:pong', data: {} }));
              } else if (packet.event === 'App\\Events\\ChatMessageEvent') {
                const data = typeof packet.data === 'string' ? JSON.parse(packet.data) : packet.data;
                appendMessage({
                  username: data.sender?.username || 'KickViewer',
                  content: data.content || '',
                  badge: data.sender?.identity?.badges?.length ? 'mod' : 'kick',
                  isStreamer: false,
                  platform: 'kick'
                });
              }
            } catch (e) {}
          };

          kickWs.onclose = () => {
            setTimeout(connectLiveKickChat, 7000);
          };
        } catch (err) {
          // Kick bağlantısı çevrimdışıysa 10 saniye sonra tekrar dene
          setTimeout(connectLiveKickChat, 10000);
        }
      }
      connectLiveKickChat();

    })();
  </script>
