<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MİRA STUDIO — Canlı Sohbet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --chat-opacity: 0.95;
      --accent-kick: #00f5a0;
      --accent-mira: #a855f7;
      --accent-tiktok: #fe2c55;
      --accent-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: rgba(9, 11, 20, var(--chat-opacity));
      color: #f1f5f9;
      user-select: none;
      transition: background 0.15s ease;
    }

    .chat-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      box-sizing: border-box;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Üst Kontrol Çubuğu */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(20, 24, 42, 0.98), rgba(12, 15, 28, 0.98));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      gap: 8px;
      -webkit-app-region: drag; /* Electron sürükleme */
    }

    .chat-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #c084fc;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #00f5a0;
      box-shadow: 0 0 8px #00f5a0;
      border-radius: 50%;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 160, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(0, 245, 160, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 160, 0); }
    }

    .chat-status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 245, 160, 0.12);
      border: 1px solid rgba(0, 245, 160, 0.35);
      color: #00f5a0;
      font-family: monospace;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .chat-opacity-control {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.45);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .chat-opacity-control input[type="range"] {
      width: 55px;
      height: 3px;
      accent-color: #a855f7;
      cursor: pointer;
    }
    .chat-opacity-control span:last-child {
      font-family: monospace;
      font-size: 10px;
      color: #00f5a0;
      font-weight: 700;
      width: 28px;
      text-align: right;
    }

    .btn-clear {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .btn-tts {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn-tts:hover {
      background: rgba(0, 245, 160, 0.12);
      border-color: #00f5a0;
      color: #00f5a0;
    }
    .btn-tts.active {
      background: rgba(0, 245, 160, 0.18);
      border-color: #00f5a0;
      color: #00f5a0;
      box-shadow: 0 0 10px rgba(0, 245, 160, 0.25);
    }

    /* Mesaj Akış Alanı */
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    .chat-feed::-webkit-scrollbar {
      width: 5px;
    }
    .chat-feed::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.35);
      border-radius: 4px;
    }

    .clean-chat-msg {
      background: rgba(18, 22, 38, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 3px solid rgba(168, 85, 247, 0.5);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.45;
      display: flex;
      align-items: baseline;
      gap: 8px;
      animation: msgPop 0.15s ease-out;
    }
    @keyframes msgPop {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .clean-chat-msg.is-streamer {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), rgba(168, 85, 247, 0.12));
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-left: 4px solid #f59e0b;
    }
    .clean-chat-msg.is-system {
      background: rgba(168, 85, 247, 0.08);
      border-left-color: #a855f7;
      color: #cbd5e1;
      font-size: 12px;
    }

    .clean-msg-time {
      font-size: 10.5px;
      color: #64748b;
      font-family: monospace;
      flex-shrink: 0;
    }
    .clean-msg-badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
      background: #00f5a0;
      color: #000;
    }
    .clean-chat-msg.is-streamer .clean-msg-badge {
      background: #f59e0b;
      color: #000;
    }
    .clean-chat-msg.is-system .clean-msg-badge {
      background: #a855f7;
      color: #fff;
    }
    .clean-msg-user {
      font-weight: 800;
      color: #e2e8f0;
      cursor: pointer;
      flex-shrink: 0;
    }
    .clean-msg-user:hover {
      text-decoration: underline;
      color: #00f5a0;
    }
    .clean-chat-msg.is-streamer .clean-msg-user {
      color: #fbbf24;
    }
    .clean-msg-text {
      color: #f1f5f9;
      word-break: break-word;
      font-weight: 500;
    }
    .clean-chat-msg.is-streamer .clean-msg-text {
      color: #fef3c7;
      font-weight: 600;
    }

    /* Giriş Çubuğu */
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(16, 20, 36, 0.98), rgba(9, 12, 22, 0.98));
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      align-items: center;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
    }
    .chat-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.35);
    }
    .chat-send-btn {
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .chat-send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.5);
    }
  </style>
</head>
<body>

  <div class="chat-shell">
    <!-- Üst Bar -->
    <header class="chat-header">
      <div class="chat-title-box">
        <span class="live-dot"></span>
        <span>CANLI SOHBET</span>
        <span class="chat-status-pill" id="float-chat-pill">🟢 Kick Chat</span>
      </div>

      <div class="chat-header-actions">
        <a id="kick-popout-link" href="https://kick.com" target="_blank" onclick="window.open(this.href, 'kick_chat_popout', 'width=420,height=680,scrollbars=yes,resizable=yes'); return false;" class="btn-tts" style="background: rgba(0,245,160,0.15); border-color: rgba(0,245,160,0.4); color: #00f5a0; text-decoration: none;" title="Kick resmi sohbetini açar; yayıncı hesabınızla izleyicilere yanıt verebilirsiniz">
          <span>⚡</span> <span>Kick Chat</span>
        </a>
        <button type="button" class="btn-tts" id="floating-tts-btn" onclick="toggleFloatingTTS()" title="Sohbet Sesli Okuma (TTS) Aç/Kapat">
          <span>🔊</span> <span id="floating-tts-text">TTS: KAPALI</span>
        </button>
        <button type="button" class="btn-clear" onclick="clearFeed()" title="Sohbeti Temizle">
          🗑️ Temizle
        </button>
      </div>
    </header>

    <!-- Mesaj Akışı -->
    <main class="chat-feed" id="chat-feed">
      <div class="clean-chat-msg is-system">
        <span class="clean-msg-time" id="init-time">17:00</span>
        <span class="clean-msg-badge">MİRA</span>
        <span class="clean-msg-text" id="float-system-intro">Canlı sohbet konsolu aktif. Mesajlarınızı doğrudan buradan yanıtlayabilirsiniz.</span>
      </div>
    </main>

    <!-- Mesaj Gönderme Çubuğu -->
    <footer class="chat-input-bar">
      <input type="text" id="streamer-input" class="chat-input" placeholder="Yayıncı olarak mesaj yazın... (Enter)" autocomplete="off">
      <button type="button" class="chat-send-btn" onclick="sendReply()">
        Gönder
      </button>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      const SESSION_ID = 'float_' + Math.random().toString(36).substr(2, 9);
      const seenIds = new Set();
      const chatFeed = document.getElementById('chat-feed');
      const inputEl = document.getElementById('streamer-input');
      const popLink = document.getElementById('kick-popout-link');
      const pill = document.getElementById('float-chat-pill');

      let streamerName = localStorage.getItem('mira_streamer_username') || '';
      let kickSlug = localStorage.getItem('mira_kick_slug') || streamerName || '';

      function updateStreamerChatInfo(slug, name) {
        if (slug) kickSlug = slug;
        if (name) streamerName = name;
        else if (slug && !streamerName) streamerName = slug;

        if (inputEl) inputEl.placeholder = streamerName ? `${streamerName} olarak mesaj yazın... (Enter)` : 'Kanal bağlı değil — önce stüdyodan kanal bağlayın';
        if (popLink && kickSlug) popLink.href = `https://kick.com/popout/${encodeURIComponent(kickSlug)}/chat`;
        if (pill) pill.textContent = kickSlug ? `🟢 Kick: ${kickSlug}` : '⚪ Kick Bekleniyor';
      }

      updateStreamerChatInfo(kickSlug, streamerName);

      fetch('/api/streamer/config')
        .then(r => r.json())
        .then(data => {
          if (data && data.streamer) {
            updateStreamerChatInfo(data.streamer.kickSlug, data.streamer.username);
          }
        }).catch(() => {});

      function getNowTimeStr() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      const tEl = document.getElementById('init-time');
      if (tEl) tEl.textContent = getNowTimeStr();

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      const recentFloatingContents = new Map();

      window.setFloatingChatOpacity = function (val) {};

      window.clearFeed = function () {
        if (chatFeed) chatFeed.innerHTML = '';
        seenIds.clear();
        recentFloatingContents.clear();
        const clearPayload = { id: 'clear_' + Date.now(), type: 'CLEAR_CHAT', time: Date.now() };
        try { new BroadcastChannel('kick_stream_bus').postMessage(clearPayload); } catch (e) {}
        try { new BroadcastChannel('kick_hero_bus').postMessage(clearPayload); } catch (e) {}
        fetch('/api/clear-chat', { method: 'POST' }).catch(() => {});
      };

      window.replyTo = function (username) {
        if (!inputEl) return;
        inputEl.value = `@${username} ` + inputEl.value;
        inputEl.focus();
      };

      // Mesaj Ekleme Motoru (Deduplication Korumalı)
      function appendMessage(item) {
        if (!item) return;
        const content = String(item.content || item.text || '').trim();
        if (!content) return;
        const user = item.username || 'İzleyici';
        const now = Date.now();

        const msgKey = item.id || (user + '_' + content + '_' + Math.floor((item.time || now) / 1200));
        if (seenIds.has(msgKey)) return;
        seenIds.add(msgKey);
        if (seenIds.size > 200) {
          const oldest = seenIds.values().next().value;
          seenIds.delete(oldest);
        }

        const isStreamer = !!item.isStreamer || item.badge === 'streamer' || user.toLowerCase() === streamerName.toLowerCase() || (kickSlug && user.toLowerCase() === kickSlug.toLowerCase()) || user === 'Yayıncı' || user === 'MİRA (Yayıncı)' || user === 'MİRA';
        const normKey = (isStreamer ? '__streamer__' : user.toLowerCase()) + ':' + content.toLowerCase();
        const lastT = recentFloatingContents.get(normKey) || 0;
        if ((now - lastT) < 6000) return;
        recentFloatingContents.set(normKey, now);
        if (recentFloatingContents.size > 150) recentFloatingContents.delete(recentFloatingContents.keys().next().value);

        const displayUser = isStreamer ? (kickSlug || streamerName) : user;
        const timeStr = item.timeStr || getNowTimeStr();
        const badge = isStreamer ? '👑 YAYINCI' : (item.badge === 'tiktok' ? 'TIKTOK' : 'KICK');

        const card = document.createElement('div');
        card.className = `clean-chat-msg ${isStreamer ? 'is-streamer' : ''}`;
        card.innerHTML = `
          <span class="clean-msg-time">${timeStr}</span>
          <span class="clean-msg-badge">${badge}</span>
          <span class="clean-msg-user" onclick="replyTo('${escapeHtml(displayUser)}')">${escapeHtml(displayUser)}:</span>
          <span class="clean-msg-text">${escapeHtml(content)}</span>
        `;

        chatFeed.appendChild(card);
        while (chatFeed.children.length > 80) {
          chatFeed.removeChild(chatFeed.firstChild);
        }
        chatFeed.scrollTop = chatFeed.scrollHeight;
      }

      // Mesaj Gönderme
      window.sendReply = function () {
        const text = (inputEl.value || '').trim();
        if (!text) return;

        const payload = {
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          senderSession: SESSION_ID,
          type: 'CHAT_MESSAGE',
          username: streamerName,
          content: text,
          badge: 'streamer',
          isStreamer: true,
          platform: 'kick',
          timeStr: getNowTimeStr(),
          time: Date.now()
        };

        appendMessage(payload);

        try {
          const bus = new BroadcastChannel('kick_stream_bus');
          bus.postMessage(payload);
        } catch (e) {}

        try {
          const busHero = new BroadcastChannel('kick_hero_bus');
          busHero.postMessage(payload);
        } catch (e) {}

        fetch('/api/chat-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});

        inputEl.value = '';
        inputEl.focus();
      };

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendReply();
        }
      });

      // TTS Yönetimi (Yüzen Pencere)
      let floatTtsEnabled = false;
      function syncFloatTtsUI() {
        const btn = document.getElementById('floating-tts-btn');
        const txt = document.getElementById('floating-tts-text');
        if (!btn || !txt) return;
        if (floatTtsEnabled) {
          btn.classList.add('active');
          txt.textContent = 'TTS: AÇIK';
        } else {
          btn.classList.remove('active');
          txt.textContent = 'TTS: KAPALI';
        }
      }

      try {
        const savedCfg = localStorage.getItem('mira_tts_config');
        if (savedCfg) {
          const c = JSON.parse(savedCfg);
          floatTtsEnabled = !!c.ttsChatEnabled;
        }
      } catch(e) {}
      syncFloatTtsUI();

      window.toggleFloatingTTS = function() {
        floatTtsEnabled = !floatTtsEnabled;
        syncFloatTtsUI();
        try {
          let c = {};
          const s = localStorage.getItem('mira_tts_config');
          if (s) c = JSON.parse(s);
          c.ttsChatEnabled = floatTtsEnabled;
          localStorage.setItem('mira_tts_config', JSON.stringify(c));
          const bus = new BroadcastChannel('kick_stream_bus');
          bus.postMessage({ type: 'UPDATE_TTS_CONFIG', config: c });
          fetch('/api/tts/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(c)
          }).catch(() => {});
        } catch(e) {}
      };

      // BroadcastChannel Dinleme (Diğer pencerelerden gelen mesajlar)
      try {
        const bus = new BroadcastChannel('kick_stream_bus');
        bus.addEventListener('message', (e) => {
          if (e.data && (e.data.type === 'TEST_CHAT' || e.data.type === 'CHAT_MESSAGE')) {
            if (e.data.senderSession && e.data.senderSession === SESSION_ID) return;
            appendMessage(e.data);
          } else if (e.data && e.data.type === 'UPDATE_TTS_CONFIG' && e.data.config) {
            floatTtsEnabled = !!e.data.config.ttsChatEnabled;
            syncFloatTtsUI();
          }
        });
      } catch (e) {}

      // Polling (sunucudan canlı Kick ve TikTok mesajlarını alma)
      let lastPoll = Date.now() - 5000;
      setInterval(() => {
        fetch(`/api/poll?since=${lastPoll}`)
          .then(r => r.json())
          .then(data => {
            if (data && data.events && data.events.length > 0) {
              data.events.forEach(ev => {
                if (ev.time > lastPoll) lastPoll = ev.time;
                if (ev.type === 'CHAT_MESSAGE' || ev.type === 'TEST_CHAT') {
                  if (ev.senderSession !== SESSION_ID) {
                    appendMessage(ev);
                  }
                }
              });
            }
          })
          .catch(() => {});
      }, 1200);

    })();
  </script>
</body>
</html>
