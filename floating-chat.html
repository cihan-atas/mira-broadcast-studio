<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MİRA STUDIO — Canlı Sohbet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --chat-opacity: 0.95;
      --accent-kick: #00f5a0;
      --accent-mira: #a855f7;
      --accent-tiktok: #fe2c55;
      --accent-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: rgba(9, 11, 20, var(--chat-opacity));
      color: #f1f5f9;
      user-select: none;
      transition: background 0.15s ease;
    }

    .chat-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      box-sizing: border-box;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Üst Kontrol Çubuğu */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(20, 24, 42, 0.98), rgba(12, 15, 28, 0.98));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      gap: 8px;
      -webkit-app-region: drag; /* Electron sürükleme */
    }

    .chat-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #c084fc;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #00f5a0;
      box-shadow: 0 0 8px #00f5a0;
      border-radius: 50%;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 160, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(0, 245, 160, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 160, 0); }
    }

    .chat-status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 245, 160, 0.12);
      border: 1px solid rgba(0, 245, 160, 0.35);
      color: #00f5a0;
      font-family: monospace;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .chat-opacity-control {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.45);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .chat-opacity-control input[type="range"] {
      width: 55px;
      height: 3px;
      accent-color: #a855f7;
      cursor: pointer;
    }
    .chat-opacity-control span:last-child {
      font-family: monospace;
      font-size: 10px;
      color: #00f5a0;
      font-weight: 700;
      width: 28px;
      text-align: right;
    }

    .btn-clear {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* Mesaj Akış Alanı */
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    .chat-feed::-webkit-scrollbar {
      width: 5px;
    }
    .chat-feed::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.35);
      border-radius: 4px;
    }

    .clean-chat-msg {
      background: rgba(18, 22, 38, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 3px solid rgba(168, 85, 247, 0.5);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.45;
      display: flex;
      align-items: baseline;
      gap: 8px;
      animation: msgPop 0.15s ease-out;
    }
    @keyframes msgPop {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .clean-chat-msg.is-streamer {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), rgba(168, 85, 247, 0.12));
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-left: 4px solid #f59e0b;
    }
    .clean-chat-msg.is-system {
      background: rgba(168, 85, 247, 0.08);
      border-left-color: #a855f7;
      color: #cbd5e1;
      font-size: 12px;
    }

    .clean-msg-time {
      font-size: 10.5px;
      color: #64748b;
      font-family: monospace;
      flex-shrink: 0;
    }
    .clean-msg-badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
      background: #00f5a0;
      color: #000;
    }
    .clean-chat-msg.is-streamer .clean-msg-badge {
      background: #f59e0b;
      color: #000;
    }
    .clean-chat-msg.is-system .clean-msg-badge {
      background: #a855f7;
      color: #fff;
    }
    .clean-msg-user {
      font-weight: 800;
      color: #e2e8f0;
      cursor: pointer;
      flex-shrink: 0;
    }
    .clean-msg-user:hover {
      text-decoration: underline;
      color: #00f5a0;
    }
    .clean-chat-msg.is-streamer .clean-msg-user {
      color: #fbbf24;
    }
    .clean-msg-text {
      color: #f1f5f9;
      word-break: break-word;
      font-weight: 500;
    }
    .clean-chat-msg.is-streamer .clean-msg-text {
      color: #fef3c7;
      font-weight: 600;
    }

    /* Giriş Çubuğu */
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(16, 20, 36, 0.98), rgba(9, 12, 22, 0.98));
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      align-items: center;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
    }
    .chat-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.35);
    }
    .chat-send-btn {
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .chat-send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.5);
    }
  </style>
</head>
<body>

  <div class="chat-shell">
    <!-- Üst Bar -->
    <header class="chat-header">
      <div class="chat-title-box">
        <span class="live-dot"></span>
        <span>CANLI SOHBET</span>
        <span class="chat-status-pill">🟢 Kick: cihanatas</span>
      </div>

      <div class="chat-header-actions">
        <button type="button" class="btn-clear" onclick="clearFeed()" title="Sohbeti Temizle">
          🗑️ Temizle
        </button>
      </div>
    </header>

    <!-- Mesaj Akışı -->
    <main class="chat-feed" id="chat-feed">
      <div class="clean-chat-msg is-system">
        <span class="clean-msg-time" id="init-time">17:00</span>
        <span class="clean-msg-badge">MİRA</span>
        <span class="clean-msg-text">Canlı sohbet konsolu aktif. Mesajlarınızı buradan cihanatas olarak yanıtlayabilirsiniz.</span>
      </div>
    </main>

    <!-- Mesaj Gönderme Çubuğu -->
    <footer class="chat-input-bar">
      <input type="text" id="streamer-input" class="chat-input" placeholder="cihanatas olarak mesaj yazın... (Enter)" autocomplete="off">
      <button type="button" class="chat-send-btn" onclick="sendReply()">
        Gönder
      </button>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      const SESSION_ID = 'float_' + Math.random().toString(36).substr(2, 9);
      const seenIds = new Set();
      const chatFeed = document.getElementById('chat-feed');
      const inputEl = document.getElementById('streamer-input');

      const streamerName = localStorage.getItem('mira_streamer_username') || 'cihanatas';
      if (inputEl) inputEl.placeholder = `${streamerName} olarak mesaj yazın... (Enter)`;

      function getNowTimeStr() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      const tEl = document.getElementById('init-time');
      if (tEl) tEl.textContent = getNowTimeStr();

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      window.setFloatingChatOpacity = function (val) {};

      window.clearFeed = function () {
        if (chatFeed) chatFeed.innerHTML = '';
      };

      window.replyTo = function (username) {
        if (!inputEl) return;
        inputEl.value = `@${username} ` + inputEl.value;
        inputEl.focus();
      };

      // Mesaj Ekleme Motoru (Deduplication Korumalı)
      function appendMessage(item) {
        if (!item) return;
        const content = item.content || item.text || '';
        if (!content) return;
        const user = item.username || 'İzleyici';

        const msgKey = item.id || (user + '_' + content + '_' + Math.floor((item.time || Date.now()) / 1200));
        if (seenIds.has(msgKey)) return;
        seenIds.add(msgKey);
        if (seenIds.size > 200) {
          const oldest = seenIds.values().next().value;
          seenIds.delete(oldest);
        }

        const isStreamer = !!item.isStreamer || user.toLowerCase() === streamerName.toLowerCase() || user === 'MİRA (Yayıncı)' || user === 'MİRA';
        const displayUser = isStreamer ? streamerName : user;
        const timeStr = item.timeStr || getNowTimeStr();
        const badge = isStreamer ? '👑 YAYINCI' : (item.badge === 'tiktok' ? 'TIKTOK' : 'KICK');

        const card = document.createElement('div');
        card.className = `clean-chat-msg ${isStreamer ? 'is-streamer' : ''}`;
        card.innerHTML = `
          <span class="clean-msg-time">${timeStr}</span>
          <span class="clean-msg-badge">${badge}</span>
          <span class="clean-msg-user" onclick="replyTo('${escapeHtml(displayUser)}')">${escapeHtml(displayUser)}:</span>
          <span class="clean-msg-text">${escapeHtml(content)}</span>
        `;

        chatFeed.appendChild(card);
        while (chatFeed.children.length > 80) {
          chatFeed.removeChild(chatFeed.firstChild);
        }
        chatFeed.scrollTop = chatFeed.scrollHeight;
      }

      // Mesaj Gönderme
      window.sendReply = function () {
        const text = (inputEl.value || '').trim();
        if (!text) return;

        const payload = {
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          senderSession: SESSION_ID,
          type: 'TEST_CHAT',
          username: streamerName,
          content: text,
          badge: 'streamer',
          isStreamer: true,
          platform: 'kick',
          timeStr: getNowTimeStr(),
          time: Date.now()
        };

        appendMessage(payload);

        try {
          const bus = new BroadcastChannel('kick_stream_bus');
          bus.postMessage(payload);
        } catch (e) {}

        fetch('/api/chat-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});

        inputEl.value = '';
        inputEl.focus();
      };

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendReply();
        }
      });

      // BroadcastChannel Dinleme (Diğer pencerelerden gelen mesajlar)
      try {
        const bus = new BroadcastChannel('kick_stream_bus');
        bus.addEventListener('message', (e) => {
          if (e.data && (e.data.type === 'TEST_CHAT' || e.data.type === 'CHAT_MESSAGE')) {
            if (e.data.senderSession && e.data.senderSession === SESSION_ID) return;
            appendMessage(e.data);
          }
        });
      } catch (e) {}

      // Polling fallback (sunucudan son mesajları alma)
      let lastPoll = Date.now() - 5000;
      setInterval(() => {
        fetch(`/api/chat-messages?since=${lastPoll}`)
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data.messages) && data.messages.length > 0) {
              data.messages.forEach(m => appendMessage(m));
            }
            lastPoll = Date.now();
          })
          .catch(() => {});
      }, 3000);

    })();
  </script>
</body>
</html>
